# Render.com Deployment Configuration for VidhanAI Backend (Free Tier)
# https://render.com/docs/yaml

services:
  - type: web
    name: vidhanai-backend
    env: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn --workers 2 --timeout 120 --bind 0.0.0.0:$PORT "app:create_app()"
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: GROQ_API_KEY
        sync: false # Set in Render Dashboard
      - key: SECRET_KEY
        generateValue: true
    disk:
      name: vidhanai-data
      mountPath: /opt/render/project/src/backend/instance
      sizeGB: 1
