[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vidhanai-backend"
version = "0.1.0"
description = "VidhanAI Flask backend with RAG and multi-agent orchestration"
requires-python = ">=3.10,<3.14"
dependencies = [
    "Flask==3.0.0",
    "Flask-SQLAlchemy==3.1.1",
    "Flask-CORS==4.0.0",
    "gunicorn>=21.2.0",
    "beautifulsoup4==4.12.2",
    "requests==2.31.0",
    "lxml>=5.1.0",
    "SQLAlchemy>=2.0.23",
    "Werkzeug==3.0.1",
    "pandas>=2.2.0",
    "numpy>=1.26.3",
    "python-dotenv==1.0.0",
    "APScheduler==3.10.4",
    "groq>=0.4.2",
    "chromadb>=0.4.22",
    "sentence-transformers>=2.2.2",
    "tqdm>=4.66.1",
    "evaluate==0.4.1",
    "rouge_score==0.1.2",
    "sacrebleu==2.4.0",
    "textblob==0.17.1",
    "crewai>=0.193.2,<1.0",
    "a2a-sdk>=1.2.3,<2.0",
    "google-adk>=2.12.0,<3.0",
    "mcp>=2.3.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
    "pytest-flask==1.3.0",
    "ruff==0.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py310"
line-length = 100
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]
